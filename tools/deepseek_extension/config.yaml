# Configuration for Isolated DeepSeek Extension Bridge Server

server:
  host: "127.0.0.1"
  port: 8765
  cors_allowed_origins:
    - "https://chat.deepseek.com"
    - "http://127.0.0.1:8765"
    - "http://localhost:8765"

dataset:
  questions_csv: "../../data/processed/xes3g5m/questions.csv"
  total_questions: 7652

storage:
  output_dir: "data"
  annotations_file: "data/deepseek_annotations.jsonl"
  failures_file: "data/deepseek_failures.jsonl"
  state_file: "data/state.json"

pacing:
  default_delay_seconds: 6.0
  min_delay_seconds: 3.0
  max_delay_seconds: 30.0

validation:
  required_skills:
    - attention
    - working_memory
    - logical_reasoning
    - language_processing
    - critical_thinking
    - metacognition
  min_score: 0
  max_score: 3
  min_confidence: 0.0
  max_confidence: 1.0
